name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timetracker_test
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timetracker -d timetracker_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://timetracker:timetracker@localhost:5432/timetracker_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install -e 'backend[dev]'
      - name: Lint backend
        run: ruff format --check backend && ruff check backend
      - name: Test backend
        run: pytest backend/tests --cov=time_tracker --cov-report=term-missing --cov-fail-under=75
      - name: Prove PostgreSQL migration and seed
        working-directory: backend
        run: alembic upgrade head && python scripts/seed.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -e 'backend[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Prepare clean migrated database
        run: scripts/prepare-e2e-db.sh
      - name: Browser-to-database workflow
        run: npm run test:e2e
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-database-password
          TIME_TRACKER_PASSWORD: ci-application-password
          TIME_TRACKER_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
        run: docker compose config --quiet
      - name: Build and start complete stack
        env:
          POSTGRES_PASSWORD: ci-database-password
          TIME_TRACKER_PASSWORD: ci-application-password
          TIME_TRACKER_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
        run: docker compose up --build --detach --wait
      - name: Verify public health and protected API
        run: |
          curl --fail http://localhost:3000/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/settings)" = "401"
      - name: Show logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-database-password
          TIME_TRACKER_PASSWORD: ci-application-password
          TIME_TRACKER_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
        run: docker compose logs
      - name: Stop stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-database-password
          TIME_TRACKER_PASSWORD: ci-application-password
          TIME_TRACKER_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
        run: docker compose down --volumes
