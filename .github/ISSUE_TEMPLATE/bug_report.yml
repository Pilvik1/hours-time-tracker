name: Bug report
description: Report a reproducible Hours Time Tracker defect
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, database files, or real work-hour data. Security issues must be reported privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: v0.1.0-beta.4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
