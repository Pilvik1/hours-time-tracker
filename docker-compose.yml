services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timetracker}
      POSTGRES_USER: ${POSTGRES_USER:-timetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - timetracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetracker} -d ${POSTGRES_DB:-timetracker}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-timetracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-timetracker}
      TIME_TRACKER_PASSWORD: ${TIME_TRACKER_PASSWORD:?Set TIME_TRACKER_PASSWORD in .env}
      TIME_TRACKER_SESSION_SECRET: ${TIME_TRACKER_SESSION_SECRET:?Set TIME_TRACKER_SESSION_SECRET in .env}
      TIME_TRACKER_COOKIE_SECURE: ${TIME_TRACKER_COOKIE_SECURE:-false}
      TIME_TRACKER_SESSION_MAX_AGE_SECONDS: ${TIME_TRACKER_SESSION_MAX_AGE_SECONDS:-604800}
      TIME_TRACKER_TIMEZONE: ${TIME_TRACKER_TIMEZONE:-UTC}
      TIME_TRACKER_CORS_ORIGINS: ${TIME_TRACKER_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  timetracker_postgres_data:
