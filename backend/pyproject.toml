[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hours-time-tracker-backend"
version = "0.1.0b5"
description = "Local-first single-user time tracking API"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Håkon Pilvik" }]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/Pilvik1/hours-time-tracker"
Repository = "https://github.com/Pilvik1/hours-time-tracker"
Issues = "https://github.com/Pilvik1/hours-time-tracker/issues"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["time_tracker"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI intentionally uses Depends() in defaults.
